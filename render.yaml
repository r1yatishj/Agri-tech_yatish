services:
  # Unified Full-Stack MERN Web Service (Single Live Demo Link)
  # Combines React Frontend, Node/Express Backend & MongoDB into one unified URL
  - type: web
    name: agri-tech-yatish
    env: node
    plan: free
    buildCommand: npm install && npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
